    <h1> Welcome To NextPlay Institute</h1>
    
    <script>
         function showMessage() {
            document.getElementById("demo").innerHTML= "Hello, Welcome to Bayfront Tech student portal";
        }
        function toggleMode() {
            document.body.classList.toggle('light-mode');
            const btn = document.getElementById("modeBtn");
            if (document.body.classList.contains('light-mode')) {
                btn.innerText = " Light Mode";
            } 
            else {
                btn.innerText = "Dark Mode";
            }
        }
    
        function openModal() {
    document.getElementById('modalBackdrop').style.display = 'block';
  }
  function closeModal() {
    document.getElementById('modalBackdrop').style.display = 'none';
  }
    
    document.getElementById("myForm").addEventListener("submit", function(event ){
        event.preventDefault(); let name = document.getElementById("nameInput").value;
        document.getElementById("result").innerhtml= "Hello," + name + "! :wave:";
    });
    </script>
