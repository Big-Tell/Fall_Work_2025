<!DOCTYPE html>
<html>
    <head>
        <title>
            Butoon click example
        </title>
    </head>
    <body style="background:#ffffff">
    
    <h2>my first button click</h2>
    <botton onclick="showmessage()"> Click Me!</botton>
    <p id="demo"></p>
    <script>
        function showmessage(){
            document.getElementById("demo").innerHTML = "Hello, you clicked the button!";
        }
    </script>
    </body>
</html>
