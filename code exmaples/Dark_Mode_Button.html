<html>
<head>
  <title>My Dark Mode</title>
  <style>
    body {
      background: #13171A;
      color: #23609C;
      transition: background 0.3s, color 0.3s;
    }
    body.light-mode {
      background: #569ce2;
      color: #000000;
    }
    button {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h2>Dark Mode Example</h2>
  <button onclick="toggleMode()" id="modeBtn">:new_moon_with_face: Dark Mode</button>
  <p>This is my text!</p>
  <script>
    function toggleMode() {
      document.body.classList.toggle('light-mode');
      const btn = document.getElementById("modeBtn");
      if (document.body.classList.contains('light-mode')) {
        btn.innerText = ":sunny: Light Mode";
      } else {
        btn.innerText = ":new_moon: Dark Mode";
      }
    }
  </script>
</body>
